[pytest]
# One `pytest` from apps/api runs the API suite and the workflow-engine suite.
# (../../packages resolves to the repo's packages/ locally and to /packages in Docker.)
testpaths = tests ../../packages/workflow-engine/tests
pythonpath = .
addopts = --import-mode=importlib -ra
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    network: makes real outbound HTTP requests (deselect with -m "not network")
    live: calls real provider APIs with real keys (Gemini, Groq, Gmail, ...); skipped unless selected with -m live
