[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "flowforge-workflow-engine"
version = "0.1.0"
description = "FlowForge AI workflow engine: node registry, graph validation, and execution."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3",
    "email-validator>=2.1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
gemini = ["google-genai>=2,<3"]
openai = ["openai>=3,<4"]
anthropic = ["anthropic>=1,<2"]
providers = ["flowforge-workflow-engine[gemini,openai,anthropic]"]
test = ["pytest>=8", "pytest-asyncio>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/flowforge_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "network: makes real outbound HTTP requests (deselect with -m 'not network')",
    "live: calls real provider APIs with real keys; skipped unless selected with -m live",
]
